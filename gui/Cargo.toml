densevec = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
res = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
cross_performance = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
rectangle-pack = "0.4.2"
guillotiere = {version="*"}
