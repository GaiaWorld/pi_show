getset="0.1"
bitvec={version = "1.0", features = ["serde"]}
polygon2 = "0.3"
cssparser = "0.29"
pi_print_any="0.1"

[dependencies.web-sys]
version = "*"
features = [
	"WebGlRenderingContext",
	"WebGlBuffer",
	"WebGlVertexArrayObject",
	"WebGlShader",
	"WebGlProgram",
	"WebGlUniformLocation",
	"WebGlActiveInfo",
	"WebGlTexture",
	"WebGlRenderbuffer",
	"WebGlFramebuffer",
	"Window",
	"HtmlCanvasElement",
	"Document",
	"CanvasRenderingContext2d",
	"ImageData",
	"HtmlImageElement",
	"console",
]

[patch.yn]

[features]
default = ["warning"]
performance=["web"]
web = []
print = []
warning = []
statistics = []

[patch.crates-io]
pi_atom = {path = "D://0_rust/pi_atom"}
pi_share = {path = "../../pi_share"}
pi_assets = {path = "../../pi_assets"}
pi_flex_layout = {path = "D://0_rust/pi_flex_layout"}

