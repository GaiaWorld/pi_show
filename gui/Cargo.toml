
[package]
name = "gui"
version = "0.1.0"
authors = ["wzjsun <530739162@qq.com>"]
edition = "2018"

[dependencies]
bitflags = "1.2"
share = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
idtree = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
flex_layout = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
