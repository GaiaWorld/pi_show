slab = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
util = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
map = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master"}
atom = { git = "https://github.com/GaiaWorld/pi_lib.git", branch="master", features = ["serde"]}
