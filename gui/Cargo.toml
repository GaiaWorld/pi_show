hal_core = {path="../hal_core", features=["serde"]}
hal_derive = {path="../hal_derive"}
num-traits = "0.2.6"
fnv = "1.0.6"
lazy_static = "*"
derive_deref = "1.0.2"
paste = "0.1"
serde = { version = "1.0", features = ["derive"] }
ordered-float = { version = "1.0", default-features = false }
fxhash = "0.2.1"
wasm-bindgen = "*"
