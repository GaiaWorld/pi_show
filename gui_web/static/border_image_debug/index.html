<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>border-image 九宫格诊断</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-monospace,Consolas,monospace;background:#0f1420;color:#d7dce5}
  #app{display:flex;height:100vh}
  #panel{width:390px;flex:0 0 390px;overflow:auto;padding:14px;border-right:1px solid #263042;background:#141a28}
  #main{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto}
  h1{font-size:15px;margin:0 0 8px}
  h2{font-size:12px;margin:14px 0 6px;color:#8fa3c0;text-transform:uppercase;letter-spacing:.08em}
  .row{display:flex;gap:8px;align-items:center;margin:4px 0}
  .row label{width:96px;color:#9fb0c8}
  input[type=number],select{width:96px;background:#0d1220;color:#e6ecf5;border:1px solid #2c3a50;border-radius:4px;padding:3px 6px}
  select{width:120px}
  button{background:#22304a;color:#dbe6f7;border:1px solid #38507a;border-radius:5px;padding:5px 9px;cursor:pointer;margin:3px 4px 3px 0}
  button:hover{background:#2c4064}
  #canvasWrap{position:relative;align-self:flex-start;flex:0 0 auto;border:1px solid #2c3a50;border-radius:6px;overflow:hidden;
    background-image:repeating-conic-gradient(#1a2233 0% 25%,#111827 0% 50%);background-size:16px 16px}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 90px);width:auto;height:auto}
  .cap{font-size:12px;color:#8fa3c0;margin:0 0 4px}
  #cssWrap{align-self:flex-start;flex:0 0 auto}
  #ov{position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none}
  #cssBox{box-sizing:content-box;border-style:solid;border-color:transparent;
    background-image:repeating-conic-gradient(#1a2233 0% 25%,#111827 0% 50%);background-size:16px 16px}
  #dbg{white-space:pre-wrap;background:#0b1020;border:1px solid #233049;border-radius:6px;padding:10px;margin-top:10px}
  .bad{color:#ff6b6b;font-weight:bold}
  .ok{color:#5bd67a;font-weight:bold}
  .tag{display:inline-block;padding:0 6px;border-radius:4px;margin:2px;font-size:11px}
  .tag.on{background:#1f5133;color:#8ef0b0}
  .tag.off{background:#4a1f24;color:#ff9aa6}
  .hint{color:#8090a8;font-size:12px}
</style>
</head>
<body>
<div id="app">
<aside id="panel">
  <h1>border-image 九宫格诊断</h1>
  <div class="hint">本页把 <b>gui/src/system/render/border_image.rs</b> 的<br/>get_border_image_stream 已同步最新修复版，<br/>用真实图片 + WebGL 渲染，可对比修复效果。</div>
  <h2>预设</h2>
  <button data-preset="origxy">原始场景 xy 都平铺</button>
  <button data-preset="fail">修复前丢中心：x=Repeat, y=Stretch</button>
  <button data-preset="work">正常：x=Stretch, y=Stretch</button>
  <button data-preset="space">全丢：x=Space, y=Space</button>
  <button data-preset="xy">xy 都平铺</button>
  <button data-preset="xy0">xy 都平铺（上下 slice=0）</button>
  <button data-preset="xy0b">xy 都平铺（border 上下=0，slice 上下=0）</button>
  <button data-preset="case2">case2：836×839，slice 770 0 35 0 repeat</button>
  <button data-preset="case2w">case2 复现整体劈：归一化=全部÷宽</button>
  <button data-preset="case2real">case2 实际值：top=0.9178 bottom=0.0417（按轴）</button>
  <h2>图片 / 复现</h2>
  <div class="row"><label>image</label><select id="IMG"><option value="border.png">border.png 632x208</option><option value="case2.png">case2.png 836x839</option></select></div>
  <div class="row"><label>容差取整</label><input id="TOL" type="checkbox"> <span class="hint">修复预览</span></div>
  <div class="row"><label>slice 归一化</label><select id="NORM"><option value="axis">按轴：上/下÷高，左/右÷宽</option><option value="w">全部÷宽</option><option value="h">全部÷高</option></select></div>
  <h2>节点 / 边框</h2>
  <div class="row"><label>宽 W</label><input id="W" type="number" value="920"></div>
  <div class="row"><label>高 H</label><input id="H" type="number" value="203"></div>
  <div class="row"><label>border 左</label><input id="BL" type="number" value="60"></div>
  <div class="row"><label>border 右</label><input id="BR" type="number" value="560"></div>
  <div class="row"><label>border 上</label><input id="BT" type="number" value="0"></div>
  <div class="row"><label>border 下</label><input id="BB" type="number" value="0"></div>
  <h2 id="sliceHint">slice（图片像素，632x208）</h2>
  <div class="row"><label>top</label><input id="ST" type="number" value="0"></div>
  <div class="row"><label>right</label><input id="SR" type="number" value="560"></div>
  <div class="row"><label>bottom</label><input id="SB" type="number" value="0"></div>
  <div class="row"><label>left</label><input id="SL" type="number" value="60"></div>
  <div class="row"><label>fill</label><input id="FILL" type="checkbox" checked></div>
  <h2>repeat</h2>
  <div class="row"><label>repeat.x</label><select id="RX"><option>Stretch</option><option>Repeat</option><option>Round</option><option>Space</option></select></div>
  <div class="row"><label>repeat.y</label><select id="RY"><option>Stretch</option><option>Repeat</option><option>Round</option><option>Space</option></select></div>
  <div class="row"><label>wireframe</label><input id="WIRE" type="checkbox" checked></div>
  <div id="dbg"></div>
</aside>
<main id="main">
  <div id="canvasWrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
  <div class="hint">棋盘格 = 没有画到的区域；品红线 = 实际生成的三角形边界。</div>
  <div id="cssWrap"><div class="cap">原生 CSS border-image（期望效果）</div><div id="cssBox"></div></div>
</main>
</div>
<script>
(function(){

function calcStep(csize, img, rt){

function buildGeometry(){

  var p1bot=add(0,bottom,uv1x,uvB),p1y2=add(0,height,uv1x,uv2y),pLy2=add(left,height,uvL,uv2y),pLB=add(left,bottom,uvL,uvB); quad(p1bot,p1y2,pLy2,pLB,"BL");

  function pushV(p1,p2,p3,p4,u1,v1,u2,v2,step,offset,space,tag){

  for(var ei=0;ei<xsB.length;ei++){var s=xsB[ei];quad(add(s[0],bottom,s[2],uvB),add(s[0],height,s[2],uv2y),add(s[1],height,s[3],uv2y),add(s[1],bottom,s[3],uvB),"bottom");}
  var ysL=centerAxis(top,bottom,leftTile,S.ry,uvT,uvB);
  for(var ei=0;ei<ysL.length;ei++){var s=ysL[ei];quad(add(0,s[0],uv1x,s[2]),add(0,s[1],uv1x,s[3]),add(left,s[1],uvL,s[3]),add(left,s[0],uvL,s[2]),"left");}
  var ysR=centerAxis(top,bottom,rightTile,S.ry,uvT,uvB);
  for(var ei=0;ei<ysR.length;ei++){var s=ysR[ei];quad(add(right,s[0],uvR,s[2]),add(right,s[1],uvR,s[3]),add(width,s[1],uv2x,s[3]),add(width,s[0],uv2x,s[2]),"right");}
  function centerTile(b1,tb1,b2,tb2,tc){
    var s=scaleCenter(b1,tb1,tc); if(s>0) return s;
    s=scaleCenter(b2,tb2,tc); if(s>0) return s;
    return tc;
  }
  function centerAxis(lo,hi,tile,rt,uLo,uHi){
    var out=[],region=hi-lo;

var canvas=document.getElementById("gl");
var gl=canvas.getContext("webgl",{alpha:true,premultipliedAlpha:false,antialias:true,preserveDrawingBuffer:true});

var texture=null, imageReady=false;
var IMG_SIZES={"border.png":[632,208],"case2.png":[836,839]};
var img=new Image();
function uploadTexture(){
  texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

img.onload=function(){
  IMG_W=img.naturalWidth; IMG_H=img.naturalHeight;
  var h=document.getElementById("sliceHint"); if(h) h.textContent="slice（图片像素，"+IMG_W+"x"+IMG_H+"）";

};
function setImage(src){
  var sel=document.getElementById("IMG"); if(sel&&sel.value!==src) sel.value=src;
  if(img.getAttribute("data-src")!==src){ img.setAttribute("data-src",src); img.src=src; }
}
img.setAttribute("data-src","border.png");
img.src="border.png";
function area(g,q){
  function P(i){return g.pts[i];} var a=P(q.a),b=P(q.b),c=P(q.c),d=P(q.d);

  return ar(a,b,c)+ar(a,c,d);

function fmt(x){ if(typeof x!=="number") return String(x); if(isNaN(x)) return "NaN"; if(!isFinite(x)) return x>0?"Infinity":"-Infinity"; return (Math.round(x*1000)/1000).toString(); }
function render(){

    gl.enableVertexAttribArray(texLoc.pos);gl.vertexAttribPointer(texLoc.pos,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);gl.bufferData(gl.ARRAY_BUFFER,uvs,gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(texLoc.uv);gl.vertexAttribPointer(texLoc.uv,2,gl.FLOAT,false,0,0);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.uniform1i(texLoc.tex,0);
    gl.uniform2f(texLoc.res,W,H);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBuf);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.DYNAMIC_DRAW);
    gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0);
  }
  if(S.wire && g.quads.length){
    var lines=new Uint16Array(g.quads.length*6);
    for(var i=0;i<g.quads.length;i++){var q=g.quads[i],o=i*6;lines[o]=q.a;lines[o+1]=q.b;lines[o+2]=q.b;lines[o+3]=q.c;lines[o+4]=q.c;lines[o+5]=q.d;}
    gl.useProgram(lineProg);
    gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
    gl.enableVertexAttribArray(lineLoc.pos);gl.vertexAttribPointer(lineLoc.pos,2,gl.FLOAT,false,0,0);
    gl.uniform2f(lineLoc.res,W,H);gl.uniform4f(lineLoc.color,1.0,0.2,0.9,0.95);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lineBuf);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,lines,gl.DYNAMIC_DRAW);
    gl.drawElements(gl.LINES,lines.length,gl.UNSIGNED_SHORT,0);
  }
  drawOverlay(g);
  updateDebug(g);
  updateCss();
}
function updateDebug(g){
  var i=g.info;
  var regions={TL:0,BL:0,BR:0,TR:0,top:0,bottom:0,left:0,right:0,center:0};
  for(var n=0;n<g.quads.length;n++){var q=g.quads[n];var k=q.tag.split("#")[0];regions[k]=(regions[k]||0)+area(g,q);}
  var counts={};
  for(var n=0;n<g.quads.length;n++){var q0=g.quads[n];var k0=q0.tag.split("#")[0];counts[k0]=(counts[k0]||0)+1;}
  var names=["TL","top","TR","left","center","right","BL","bottom","BR"];
  var tagHtml="";
  for(var n=0;n<names.length;n++){var nm=names[n];var on=regions[nm]>0.5;tagHtml+="<span class=\"tag "+(on?"on":"off")+"\">"+nm+":"+(on?"画":"无")+"</span>";}
  var diag="";
  var centerDrawn = S.fill && i.right>i.left && i.bottom>i.top;
  if(isNaN(i.stepTop)){ diag+="<span class=bad>stepTop = NaN（修复后不应出现）</span>\n"; }
  else if(i.stepTop<=0){ diag+="<span class=hint>stepTop = "+fmt(i.stepTop)+" (<=0)：上/下边跳过（通常是没有上/下 border）</span>\n"; }
  if(isNaN(i.stepLeft)){ diag+="<span class=bad>stepLeft = NaN（修复后不应出现）</span>\n"; }
  else if(i.stepLeft<=0){ diag+="<span class=hint>stepLeft = "+fmt(i.stepLeft)+" (<=0)：左/右边跳过</span>\n"; }
  diag += centerDrawn ? "<span class=ok>中心：按 repeat 平铺绘制（独立于四条边，不受 step 影响）</span>\n" : "<span class=hint>中心：未绘制（fill 关闭或内区域为空）</span>\n";
  if(S.norm!=="axis"){ diag += "<span class=bad>⚠ slice 归一化不是按轴：上/下应按图高 "+IMG_H+" 归一化，不是宽/高混用</span>\n"; }
  var splitTags=[];
  for(var nm2 in counts){ if((nm2==="top"||nm2==="bottom"||nm2==="left"||nm2==="right"||nm2==="center")&&counts[nm2]>1) splitTags.push(nm2+"="+counts[nm2]); }
  if(splitTags.length){ diag += "<span class=bad>⚠ 已劈开："+splitTags.join(" ")+"（红色线=分界）</span>\n"; }
  else { diag += "<span class=ok>✅ 未劈开</span>\n"; }
  var dbg=document.getElementById("dbg");
  dbg.innerHTML = "<b>几何输出</b>\n"+tagHtml+"\n\n"
    +"left="+fmt(i.left)+"  right="+fmt(i.right)+"  top="+fmt(i.top)+"  bottom="+fmt(i.bottom)+"\n"
    +"归一化="+(S.norm==="w"?"全部÷宽":(S.norm==="h"?"全部÷高":"按轴"))+"  uvL="+fmt(i.uvL)+"  uvR="+fmt(i.uvR)+"  uvT="+fmt(i.uvT)+"  uvB="+fmt(i.uvB)+"\n"
    +"texture 左/右/上/下/中宽高: "+fmt(i.texLW)+" / "+fmt(i.texRW)+" / "+fmt(i.texTH)+" / "+fmt(i.texBH)+" / "+fmt(i.texCW)+" / "+fmt(i.texCH)+"\n"
    +"tiles: top="+fmt(i.topTile)+" bottom="+fmt(i.bottomTile)+" left="+fmt(i.leftTile)+" right="+fmt(i.rightTile)+" center="+fmt(i.centerW)+"x"+fmt(i.centerH)+"\n"
    +"stepTop="+fmt(i.stepTop)+"  stepLeft="+fmt(i.stepLeft)+"  (quads="+g.quads.length+")\n"
    +"段数：top="+(counts.top||0)+" bottom="+(counts.bottom||0)+" left="+(counts.left||0)+" right="+(counts.right||0)+" center="+(counts.center||0)+"  [容差取整:"+(S.tol?"开":"关")+"]\n\n"+diag;
}
function drawOverlay(g){
  var ov=document.getElementById("ov"), gl=document.getElementById("gl"); if(!ov||!gl) return;
  ov.width=S.W; ov.height=S.H;
  var dw=gl.clientWidth||S.W, dh=gl.clientHeight||S.H;
  ov.style.width=dw+"px"; ov.style.height=dh+"px";
  var ox=ov.getContext("2d"); ox.clearRect(0,0,S.W,S.H);
  if(!S.wire) return;
  function P(i){return g.pts[i];}
  ox.strokeStyle="rgba(255,51,230,0.95)"; ox.lineWidth=1;
  for(var i=0;i<g.quads.length;i++){
    var q=g.quads[i],a=P(q.a),b=P(q.b),c=P(q.c),d=P(q.d);
    ox.beginPath();ox.moveTo(a.x,a.y);ox.lineTo(b.x,b.y);ox.lineTo(c.x,c.y);ox.lineTo(d.x,d.y);ox.closePath();ox.stroke();
  }
  var groups={};
  for(var i=0;i<g.quads.length;i++){
    var q=g.quads[i],a=P(q.a),b=P(q.b),c=P(q.c),d=P(q.d);
    var tag=q.tag.split("#")[0];
    var x0=Math.min(a.x,b.x,c.x,d.x),x1=Math.max(a.x,b.x,c.x,d.x);
    var y0=Math.min(a.y,b.y,c.y,d.y),y1=Math.max(a.y,b.y,c.y,d.y);
    (groups[tag]||(groups[tag]=[])).push({x0:x0,x1:x1,y0:y0,y1:y1});
  }
  ox.strokeStyle="rgba(255,40,40,0.98)"; ox.lineWidth=3;
  ox.font="12px ui-monospace,Consolas,monospace";
  for(var tag in groups){
    var bs=groups[tag]; if(bs.length<=1) continue;
    var xs=[],ys=[];
    for(var k=0;k<bs.length;k++){xs.push(bs[k].x0,bs[k].x1);ys.push(bs[k].y0,bs[k].y1);}
    xs=xs.filter(function(v,i,arr){return arr.indexOf(v)===i;}).sort(function(a,b){return a-b;});
    ys=ys.filter(function(v,i,arr){return arr.indexOf(v)===i;}).sort(function(a,b){return a-b;});
    var minY=Math.min.apply(null,bs.map(function(b){return b.y0;})),maxY=Math.max.apply(null,bs.map(function(b){return b.y1;}));
    var minX=Math.min.apply(null,bs.map(function(b){return b.x0;})),maxX=Math.max.apply(null,bs.map(function(b){return b.x1;}));
    for(var j=1;j<xs.length-1;j++){var x=xs[j];ox.beginPath();ox.moveTo(x,minY);ox.lineTo(x,maxY);ox.stroke();ox.fillStyle="#ffdf5d";ox.fillText("split x="+Math.round(x),x+4,minY+14);}
    for(var j=1;j<ys.length-1;j++){var y=ys[j];ox.beginPath();ox.moveTo(minX,y);ox.lineTo(maxX,y);ox.stroke();ox.fillStyle="#ffdf5d";ox.fillText("split y="+Math.round(y),minX+4,y-4);}
  }
}
function cssRepeat(v){return String(v).toLowerCase();}
function updateCss(){
  var el=document.getElementById("cssBox"); if(!el) return;
  el.style.width=(S.W-S.L-S.R)+"px";
  el.style.height=(S.H-S.T-S.B)+"px";
  el.style.borderWidth=S.T+"px "+S.R+"px "+S.B+"px "+S.L+"px";
  el.style.borderImageSource='url("'+(img.getAttribute("data-src")||"border.png")+'")';
  el.style.borderImageSlice=S.ST+" "+S.SR+" "+S.SB+" "+S.SL+(S.fill?" fill":"");
  el.style.borderImageRepeat=cssRepeat(S.rx)+" "+cssRepeat(S.ry);
  el.style.borderImageWidth="1";
}
function readState(){
  S.W=+document.getElementById("W").value; S.H=+document.getElementById("H").value;
  S.L=+document.getElementById("BL").value; S.R=+document.getElementById("BR").value;
  S.T=+document.getElementById("BT").value; S.B=+document.getElementById("BB").value;
  S.ST=+document.getElementById("ST").value; S.SR=+document.getElementById("SR").value;
  S.SB=+document.getElementById("SB").value; S.SL=+document.getElementById("SL").value;
  S.fill=document.getElementById("FILL").checked;
  S.rx=document.getElementById("RX").value; S.ry=document.getElementById("RY").value;
  S.wire=document.getElementById("WIRE").checked;
  var tol=document.getElementById("TOL"); S.tol=tol?tol.checked:false;
  var norm=document.getElementById("NORM"); S.norm=norm?norm.value:"axis";
  render();
}
function setPreset(kind){
  if(kind==="origxy"){S.W=920;S.H=203;S.L=60;S.R=560;S.T=0;S.B=0;S.ST=0;S.SR=560;S.SB=0;S.SL=60;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;setImage("border.png");IMG_W=632;IMG_H=208;}
  if(kind==="fail"){S.rx="Repeat";S.ry="Stretch";}
  if(kind==="work"){S.rx="Stretch";S.ry="Stretch";}
  if(kind==="space"){S.rx="Space";S.ry="Space";}
  if(kind==="xy"){S.W=920;S.H=460;S.L=60;S.R=560;S.T=40;S.B=40;S.ST=40;S.SR=560;S.SB=40;S.SL=60;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;setImage("border.png");IMG_W=632;IMG_H=208;}
  if(kind==="xy0"){S.W=920;S.H=460;S.L=60;S.R=560;S.T=0;S.B=0;S.ST=0;S.SR=560;S.SB=0;S.SL=60;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;setImage("border.png");IMG_W=632;IMG_H=208;}
  if(kind==="xy0b"){S.W=920;S.H=460;S.L=60;S.R=560;S.T=0;S.B=0;S.ST=0;S.SR=560;S.SB=0;S.SL=60;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;setImage("border.png");IMG_W=632;IMG_H=208;}
  if(kind==="case2"){S.W=836;S.H=839;S.L=0;S.R=0;S.T=770;S.B=35;S.ST=770;S.SR=0;S.SB=35;S.SL=0;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;S.norm="axis";S.wire=true;setImage("case2.png");IMG_W=836;IMG_H=839;}
  if(kind==="case2w"){S.W=836;S.H=839;S.L=0;S.R=0;S.T=770;S.B=35;S.ST=770;S.SR=0;S.SB=35;S.SL=0;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;S.norm="w";S.wire=true;setImage("case2.png");IMG_W=836;IMG_H=839;}
  if(kind==="case2real"){S.W=836;S.H=839;S.L=0;S.R=0;S.T=770;S.B=35;S.ST=0.9178*839;S.SR=0;S.SB=0.0417*839;S.SL=0;S.fill=true;S.rx="Repeat";S.ry="Repeat";S.tol=false;S.norm="axis";S.wire=true;setImage("case2.png");IMG_W=836;IMG_H=839;}
  document.getElementById("W").value=S.W; document.getElementById("H").value=S.H;
  document.getElementById("BL").value=S.L; document.getElementById("BR").value=S.R;
  document.getElementById("BT").value=S.T; document.getElementById("BB").value=S.B;
  document.getElementById("ST").value=S.ST; document.getElementById("SR").value=S.SR;
  document.getElementById("SB").value=S.SB; document.getElementById("SL").value=S.SL;
  document.getElementById("FILL").checked=S.fill;
  document.getElementById("RX").value=S.rx; document.getElementById("RY").value=S.ry;
  document.getElementById("WIRE").checked=S.wire;
  var tol=document.getElementById("TOL"); if(tol) tol.checked=S.tol;
  var norm=document.getElementById("NORM"); if(norm) norm.value=S.norm;
  render();
}
var els=document.querySelectorAll("#panel input,#panel select");
for(var i=0;i<els.length;i++){els[i].addEventListener("input",readState);els[i].addEventListener("change",readState);}
var bs=document.querySelectorAll("button[data-preset]");
for(var i=0;i<bs.length;i++){(function(b){b.addEventListener("click",function(){setPreset(b.getAttribute("data-preset"));});})(bs[i]);}
var imsel=document.getElementById("IMG");
if(imsel) imsel.addEventListener("change",function(){var nm=imsel.value,sz=IMG_SIZES[nm];if(sz){IMG_W=sz[0];IMG_H=sz[1];}setImage(nm);render();});
readState();
window.addEventListener("resize",function(){ render(); });
requestAnimationFrame(function(){ render(); });
window.__diag=function(){var g=buildGeometry();var reg={};for(var i=0;i<g.quads.length;i++){var q=g.quads[i];var k=q.tag.split("#")[0];reg[k]=(reg[k]||0)+area(g,q);}return {steps:{top:fmt(g.info.stepTop),left:fmt(g.info.stepLeft)},regions:reg};};
window.__setPreset=setPreset;
window.__setImage=setImage;
window.__img=img;
window.__dump=function(){var g=buildGeometry();var out=[];for(var i=0;i<g.quads.length;i++){var q=g.quads[i],ids=[q.a,q.b,q.c,q.d],vmin=1e9,vmax=-1e9,ymin=1e9,ymax=-1e9,xmin=1e9,xmax=-1e9;for(var k=0;k<4;k++){var pt=g.pts[ids[k]];vmin=Math.min(vmin,pt.v);vmax=Math.max(vmax,pt.v);ymin=Math.min(ymin,pt.y);ymax=Math.max(ymax,pt.y);xmin=Math.min(xmin,pt.x);xmax=Math.max(xmax,pt.x);}out.push({tag:q.tag.split("#")[0],x:[xmin,xmax],y:[ymin,ymax],v:[+vmin.toFixed(4),+vmax.toFixed(4)]});}return out;};
})();
